<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>echo</title>
<meta name="description" content="打った言葉を、その場で声にする。">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141517" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='4' fill='%234f6bed'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%234f6bed' stroke-width='2' opacity='.6'/%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%234f6bed' stroke-width='2' opacity='.3'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f5f2;--card:#fff;--text:#1d1f23;--muted:#7b7f88;--line:#e6e4df;--accent:#4f6bed;--accent-soft:#eef1fd;
  --danger:#d9534f;--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141517;--card:#1d1f22;--text:#e9eaec;--muted:#8d929b;--line:#2c2f34;--accent:#8aa0ff;--accent-soft:#252b45;
  --danger:#ff7b72;--shadow:none;
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:640px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.logo{position:relative;width:34px;height:34px;flex:none}
.logo i{position:absolute;inset:0;margin:auto;border-radius:50%;border:2px solid var(--accent)}
.logo i:nth-child(1){width:10px;height:10px;background:var(--accent);border:none}
.logo i:nth-child(2){width:22px;height:22px;opacity:.55}
.logo i:nth-child(3){width:34px;height:34px;opacity:.25}
body.speaking .logo i:nth-child(2){animation:ripple 1.2s ease-out infinite}
body.speaking .logo i:nth-child(3){animation:ripple 1.2s ease-out .4s infinite}
@keyframes ripple{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.15);opacity:0}}
h1{font-size:22px;font-weight:600;letter-spacing:.04em;margin:0}
.tag{color:var(--muted);font-size:14px}
.spacer{flex:1}

.composer{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:6px;transition:border-color .15s}
.composer:focus-within{border-color:var(--accent)}
textarea{display:block;width:100%;min-height:96px;max-height:40vh;resize:none;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:18px;padding:12px 12px 4px}
textarea::placeholder{color:var(--muted)}
.bar{display:flex;align-items:center;gap:8px;padding:4px 6px 4px 12px}
.hint{color:var(--muted);font-size:12px;margin:8px 6px 0}
@media (hover:none),(max-width:520px){.hint{display:none}}
.voice-chip{display:inline-flex;align-items:center;gap:6px;min-width:0;max-width:100%;height:34px;padding:0 10px 0 8px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:13px;cursor:pointer;transition:border-color .15s,background .15s}
.voice-chip:hover,.voice-chip[aria-expanded="true"]{border-color:var(--accent)}
.voice-chip svg{flex:none;color:var(--accent)}
.voice-chip .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.voice-chip .meta{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.voice-chip .caret{color:var(--muted);transition:transform .15s}
.voice-chip[aria-expanded="true"] .caret{transform:rotate(180deg)}
kbd{font:inherit;font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px}
.speak{flex:none;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;height:42px;padding:0 18px;border-radius:12px;border:0;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.speak:disabled{opacity:.4;cursor:default}
.speak.stop{background:var(--danger)}
@media (prefers-color-scheme:dark){.speak{color:#10131f}}

/* 声の設定：PC は話すボタンの下に出るポップオーバー、スマホは下から出るシート */
.backdrop{position:fixed;inset:0;z-index:9;background:transparent}
.backdrop[hidden]{display:none}
.panel{position:absolute;z-index:10;top:calc(100% + 8px);left:0;width:min(360px,100%);background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.14);padding:14px 16px 12px;display:grid;gap:14px;transform-origin:top left;animation:pop .14s ease-out}
.panel[hidden]{display:none}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.panel-head{display:flex;align-items:center;gap:8px}
.panel-head h2{font-size:15px;margin:0}
.grab{display:none}
.voices{display:grid;gap:2px;max-height:190px;overflow:auto;margin:0 -6px;padding:0 2px}
.voices button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--text);font:inherit;font-size:14px;text-align:left;padding:8px 10px;border-radius:10px;cursor:pointer}
.voices button:hover{background:var(--bg)}
.voices button[aria-checked="true"]{background:var(--accent-soft)}
.voices .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.voices button[aria-checked="true"] .dot{border-color:var(--accent)}
.voices button[aria-checked="true"] .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.voices .sub{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
.slider{display:grid;grid-template-columns:44px 1fr 48px;align-items:center;gap:10px;font-size:14px}
.slider .val{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
input[type=range]{width:100%;accent-color:var(--accent)}
.panel-foot{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.panel-foot .done{margin-left:auto;height:34px;padding:0 14px;border-radius:10px;border:0;background:var(--accent);color:#fff;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
@media (prefers-color-scheme:dark){.panel-foot .done{color:#10131f}.panel{box-shadow:0 12px 40px rgba(0,0,0,.5)}}
@media (max-width:520px){
  .backdrop{background:rgba(0,0,0,.35)}
  .panel{position:fixed;top:auto;left:0;right:0;bottom:0;width:auto;border-radius:20px 20px 0 0;border-bottom:0;padding:8px 18px calc(14px + env(safe-area-inset-bottom));animation:sheet .2s ease-out}
  .grab{display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 4px}
  .voices{max-height:34vh}
  @keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
}
.link-btn{border:0;background:none;color:var(--accent);font:inherit;font-size:13px;cursor:pointer;padding:4px}

.history-head{display:flex;align-items:baseline;margin:28px 4px 8px}
.history-head h2{font-size:14px;font-weight:600;color:var(--muted);margin:0;letter-spacing:.04em}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 4px 4px 0;transition:border-color .15s,background .15s}
li.playing{border-color:var(--accent);background:var(--accent-soft)}
li button.say{flex:1;min-width:0;text-align:left;border:0;background:none;color:var(--text);font:inherit;padding:10px 4px 10px 14px;cursor:pointer;white-space:pre-wrap;word-break:break-word;display:flex;gap:10px;align-items:flex-start}
li button.say svg{flex:none;margin-top:4px;color:var(--muted)}
li.playing button.say svg{color:var(--accent)}
li .del{width:36px;height:36px;border:0;background:none;color:var(--muted);border-radius:8px;cursor:pointer;opacity:.6;flex:none}
li .del:hover{opacity:1;color:var(--danger)}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:28px 0;border:1px dashed var(--line);border-radius:12px}
.notice{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<main>
  <header>
    <div class="logo" aria-hidden="true"><i></i><i></i><i></i></div>
    <div><h1>echo</h1><div class="tag">打った言葉を、その場で声に。</div></div>
  </header>

  <div class="notice" id="unsupported" hidden>このブラウザは読み上げ（Web Speech API）に対応していません。Chrome・Safari・Edge で開いてください。</div>

  <section class="composer">
    <label for="text" class="sr">読み上げる言葉</label>
    <textarea id="text" placeholder="例：あ〜、マイクテスト" autofocus enterkeyhint="send"></textarea>
    <div class="bar">
      <button class="voice-chip" id="voiceChip" aria-haspopup="dialog" aria-expanded="false" aria-controls="panel" title="声を変える">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/></svg>
        <span class="name" id="chipName">おまかせ</span><span class="meta" id="chipMeta"></span>
        <svg class="caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <span class="spacer"></span>
      <button class="speak" id="speak" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 10v4h4l5 4V6L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
        <span>話す</span>
      </button>
    </div>
    <div class="panel" id="panel" role="dialog" aria-label="声の設定" hidden>
      <div class="grab" aria-hidden="true"></div>
      <div class="panel-head"><h2>声</h2></div>
      <div class="voices" id="voices" role="radiogroup" aria-label="声"></div>
      <label class="slider">速さ<input type="range" id="rate" min="0.5" max="2" step="0.05"><span class="val" id="rateVal"></span></label>
      <label class="slider">高さ<input type="range" id="pitch" min="0" max="2" step="0.05"><span class="val" id="pitchVal"></span></label>
      <div class="panel-foot">
        <button class="link-btn" id="test">試しに聞く</button>
        <button class="link-btn" id="resetVoice">初期値に戻す</button>
        <button class="done" id="done">完了</button>
      </div>
    </div>
  </section>
  <p class="hint"><kbd>Enter</kbd> で話す ・ <kbd>Shift</kbd>+<kbd>Enter</kbd> で改行 ・ <kbd>Esc</kbd> で止める</p>
  <div class="backdrop" id="backdrop" hidden></div>

  <div class="history-head">
    <h2>履歴</h2><span class="spacer"></span>
    <button class="link-btn" id="clear" hidden>すべて消す</button>
  </div>
  <ul id="history" aria-live="polite"></ul>
  <div class="empty" id="empty">話した言葉がここに残ります。押すと、もう一度読み上げます。</div>
</main>

<script>
const $ = s => document.querySelector(s);
const synth = window.speechSynthesis;
const KEY = "echo.v2";
const DEFAULTS = {voice: "", rate: 0.9, pitch: 1};
const store = {
  load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } },
  save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch {} },
};
const state = Object.assign({history: []}, DEFAULTS, store.load());
const save = () => store.save(state);
const text = $("#text"), speakBtn = $("#speak");
let playingId = null;

if (!synth || !window.SpeechSynthesisUtterance) {
  $("#unsupported").hidden = false;
}

/* ---------- 声 ---------- */
let voices = [];
const shortName = v => v.name.replace(/^(Microsoft|Google)\s+/, "").replace(/\s*\(.*?\)\s*$/, "").replace(/\s+-\s+Japanese.*$/i, "");
function loadVoices() {
  const all = synth ? synth.getVoices() : [];
  const ja = all.filter(v => v.lang.replace("_", "-").toLowerCase().startsWith("ja"));
  voices = ja.length ? ja : all;
  if (state.voice && !voices.some(v => v.voiceURI === state.voice) && all.length) state.voice = "";
  renderVoices();
  syncChip();
}
function renderVoices() {
  const opts = [{uri: "", name: "おまかせ", sub: "端末の日本語の声"}]
    .concat(voices.map(v => ({uri: v.voiceURI, name: shortName(v), sub: v.localService ? "" : "オンライン"})));
  $("#voices").replaceChildren(...opts.map(o => {
    const b = document.createElement("button");
    b.type = "button"; b.setAttribute("role", "radio"); b.setAttribute("aria-checked", String(o.uri === state.voice));
    b.innerHTML = `<span class="dot"></span><span class="n"></span><span class="sub"></span>`;
    b.querySelector(".n").textContent = o.name;
    b.querySelector(".sub").textContent = o.sub;
    b.onclick = () => { state.voice = o.uri; save(); renderVoices(); syncChip(); say("こんにちは。この声で読み上げます。"); };
    return b;
  }));
}
function syncChip() {
  const v = voices.find(v => v.voiceURI === state.voice);
  $("#chipName").textContent = v ? shortName(v) : "おまかせ";
  const meta = [];
  if (Math.abs(state.rate - 1) > 0.001) meta.push(`${(+state.rate).toFixed(2).replace(/0$/, "")}×`);
  if (Math.abs(state.pitch - 1) > 0.001) meta.push(`高さ ${(+state.pitch).toFixed(2).replace(/0$/, "")}`);
  $("#chipMeta").textContent = meta.length ? `・${meta.join("・")}` : "";
}
function syncSliders() {
  $("#rate").value = state.rate; $("#rateVal").textContent = `${(+state.rate).toFixed(2)}×`;
  $("#pitch").value = state.pitch; $("#pitchVal").textContent = (+state.pitch).toFixed(2);
  syncChip();
}
loadVoices();
syncSliders();
synth?.addEventListener?.("voiceschanged", loadVoices);
$("#rate").oninput = e => { state.rate = +e.target.value; syncSliders(); save(); };
$("#pitch").oninput = e => { state.pitch = +e.target.value; syncSliders(); save(); };
$("#rate").onchange = $("#pitch").onchange = () => say("この速さと高さです。");
$("#resetVoice").onclick = () => { Object.assign(state, DEFAULTS); save(); renderVoices(); syncSliders(); };
$("#test").onclick = () => say("こんにちは。この声で読み上げます。");

/* 開く・閉じる */
const panel = $("#panel"), chip = $("#voiceChip");
const isOpen = () => !panel.hidden;
function openPanel() {
  panel.hidden = false; $("#backdrop").hidden = false;
  chip.setAttribute("aria-expanded", "true");
  (panel.querySelector('[aria-checked="true"]') || panel.querySelector("button"))?.focus({preventScroll: true});
}
function closePanel(focusChip = true) {
  if (!isOpen()) return;
  panel.hidden = true; $("#backdrop").hidden = true;
  chip.setAttribute("aria-expanded", "false");
  if (focusChip) chip.focus({preventScroll: true});
}
chip.onclick = () => isOpen() ? closePanel() : openPanel();
$("#backdrop").onclick = () => closePanel(false);
$("#done").onclick = () => { closePanel(false); text.focus(); };

/* ---------- 読み上げ ---------- */
function say(str, id = null) {
  if (!synth) return;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(str);
  u.lang = "ja-JP";
  u.rate = state.rate;
  u.pitch = state.pitch;
  const v = voices.find(v => v.voiceURI === state.voice);
  if (v) { try { u.voice = v; u.lang = v.lang; } catch {} }
  u.onstart = () => setPlaying(id);
  u.onend = u.onerror = () => { if (playingId === id) setPlaying(null, true); };
  setPlaying(id);
  synth.speak(u);
}
function stop() { synth?.cancel(); setPlaying(null, true); }
function setPlaying(id, done = false) {
  playingId = done ? null : id;
  document.body.classList.toggle("speaking", !done);
  document.querySelectorAll("#history li").forEach(li => li.classList.toggle("playing", !done && li.dataset.id === String(id)));
  updateButton();
}
function updateButton() {
  const speaking = document.body.classList.contains("speaking");
  const empty = !text.value.trim();
  speakBtn.classList.toggle("stop", speaking && empty);
  speakBtn.querySelector("span").textContent = speaking && empty ? "止める" : "話す";
  speakBtn.disabled = !synth || (!speaking && empty);
}

function submit() {
  const str = text.value.trim();
  if (!str) { if (document.body.classList.contains("speaking")) stop(); return; }
  const item = {id: Date.now(), text: str};
  state.history.unshift(item);
  state.history = state.history.slice(0, 100);
  save();
  render();
  say(str, item.id);
  text.value = "";
  autosize();
  updateButton();
  text.focus();
}

text.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
    e.preventDefault();
    submit();
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { if (isOpen()) closePanel(); else stop(); } });
text.addEventListener("input", () => { autosize(); updateButton(); });
speakBtn.onclick = submit;
function autosize() { text.style.height = "auto"; text.style.height = `${Math.max(96, text.scrollHeight)}px`; }

/* ---------- 履歴 ---------- */
const ICON = `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 10v4h4l5 4V6L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>`;
function render() {
  const ul = $("#history");
  ul.replaceChildren(...state.history.map(item => {
    const li = document.createElement("li");
    li.dataset.id = item.id;
    if (String(item.id) === String(playingId)) li.classList.add("playing");
    const b = document.createElement("button");
    b.className = "say"; b.title = "もう一度読み上げる";
    b.innerHTML = ICON;
    b.append(item.text);
    b.onclick = () => say(item.text, item.id);
    const d = document.createElement("button");
    d.className = "del"; d.setAttribute("aria-label", "この履歴を消す"); d.textContent = "✕";
    d.onclick = () => { state.history = state.history.filter(x => x.id !== item.id); save(); render(); };
    li.append(b, d);
    return li;
  }));
  $("#empty").hidden = state.history.length > 0;
  $("#clear").hidden = state.history.length === 0;
}
$("#clear").onclick = () => {
  if (!confirm("履歴をすべて消しますか？")) return;
  state.history = []; save(); render();
};

render();
updateButton();
</script>
</body>
</html>
